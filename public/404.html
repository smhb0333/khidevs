<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Page Not Found — KHIDevs</title>
  <script>
    (function () {
      var repoBase='/khidevs';
      var path=window.location.pathname;
      var route=path.indexOf(repoBase)===0?path.slice(repoBase.length):path;
      if(!route) route='/';
      var target=repoBase+'/?route='+encodeURIComponent(route+window.location.search+window.location.hash);
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
